[project]
name = "gradebot"
version = "0.1.0"
description = "A Telegram bot that sends friends their new grades from Google Sheets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "IvanIkra" }]
requires-python = ">=3.12"
keywords = ["telegram", "bot", "grades", "google-sheets", "university"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiohttp>=3.10",
    "anthropic>=1.15",
    "openpyxl>=3.1",
    "tzdata>=2026.6",
]

[project.urls]
Repository = "https://github.com/IvanIkra/gradebot"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.0",
    "ruff>=0.15",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
